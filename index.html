<style>

/* refine */
*{scrollbar-width:thin;scrollbar-color:#2a5aa0 transparent}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(0deg,rgba(120,180,255,.035) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.55),transparent 60%)}
.hero{position:relative;overflow:hidden;border-color:#5ab8ff;box-shadow:0 0 0 1px rgba(63,169,255,.2),0 0 32px rgba(40,130,255,.3),inset 0 1px 0 rgba(170,225,255,.35),inset 0 0 28px rgba(40,130,255,.14)}

.cd{border-color:rgba(63,169,255,.42);box-shadow:0 10px 26px rgba(0,0,0,.4),inset 0 1px 0 rgba(150,210,255,.12),inset 0 0 22px rgba(40,130,255,.07)}
h3{font-size:14px;letter-spacing:.14em;text-shadow:0 0 6px rgba(76,201,255,.45);border-bottom-color:rgba(63,169,255,.4)}
.btn{background:rgba(30,80,160,.22);border-color:rgba(90,175,255,.55);box-shadow:none}
.btn:hover{background:rgba(63,169,255,.3)}
.pri{background:linear-gradient(180deg,#38a0ff,#1a5fd0);border-color:#8fe0ff;box-shadow:0 0 14px rgba(63,169,255,.45)}
.bar{height:10px;position:relative}
.bar::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 11px,rgba(3,8,19,.65) 11px 12px)}
.dn .ck{background:#2fd49a;border-color:#2fd49a;box-shadow:0 0 10px rgba(47,212,154,.6)}
.q.dn{opacity:.72}
.bx{border-radius:2px;border-color:rgba(63,169,255,.3)}
.nv{backdrop-filter:blur(10px);background:rgba(3,10,26,.88)}
.nv .cur{position:relative}
.nv .cur::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--ac);box-shadow:0 0 10px var(--ac)}
.in:focus{border-color:var(--ac);box-shadow:0 0 0 2px rgba(76,201,255,.25)}
::selection{background:rgba(76,201,255,.35)}
/* rank theme */
:root{--rgb:63,169,255;--lt:#7fd8ff;--p1:#38a0ff;--p2:#1a5fd0;--a2:rgba(var(--rgb),.16);--ln:rgba(var(--rgb),.3);--sky:radial-gradient(ellipse at 50% 0%,rgba(var(--rgb),.32),transparent 60%),radial-gradient(circle at 88% 92%,rgba(120,60,255,.14),transparent 50%),radial-gradient(circle at 6% 66%,rgba(var(--rgb),.1),transparent 45%)}
:root[data-rk="E"]{--rgb:110,150,205;--ac:#8fb6e6;--gd:#8fb6e6;--lt:#cfe1f7;--p1:#6f98d0;--p2:#3d5f96}
:root[data-rk="D"]{--rgb:60,200,130;--ac:#5fe3a0;--gd:#43c98a;--lt:#a9f5cf;--p1:#3fcf8c;--p2:#1c8a5a}
:root[data-rk="B"]{--rgb:150,110,255;--ac:#b48cff;--gd:#9a73ff;--lt:#d9c6ff;--p1:#9a6cff;--p2:#5d35c8}

body::before{border-color:var(--ac);outline-color:var(--ac)}
.hero{background:linear-gradient(180deg,rgba(var(--rgb),.22),rgba(3,8,20,.95));border-color:var(--ac);box-shadow:0 0 0 1px rgba(var(--rgb),.2),0 0 32px rgba(var(--rgb),.3),inset 0 1px 0 rgba(255,255,255,.25),inset 0 0 28px rgba(var(--rgb),.14)}
.lv{text-shadow:0 0 6px var(--ac),0 0 22px rgba(var(--rgb),.7)}
@keyframes gl2{50%{text-shadow:0 0 10px var(--ac),0 0 34px rgba(var(--rgb),.95)}}
.lv{animation:gl2 3.2s ease-in-out infinite}
.hero .bar i{background:linear-gradient(90deg,var(--p2),var(--lt));box-shadow:0 0 10px var(--ac)}

.cd{background:linear-gradient(180deg,rgba(var(--rgb),.14),rgba(4,10,24,.88));border-color:rgba(var(--rgb),.45);box-shadow:0 10px 26px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 22px rgba(var(--rgb),.07)}
.cd::before,.cd::after{border-color:var(--lt)}
h3{background:linear-gradient(90deg,rgba(var(--rgb),.3),transparent);border-bottom-color:rgba(var(--rgb),.45);color:var(--lt);text-shadow:0 0 6px rgba(var(--rgb),.5)}

<body><div id="app"><div id="hd"></div><div id="mn"></div></div><nav class="nv" id="nv"></nav><div id="ts" role="status"></div><div id="ov" data-a="ov" role="dialog" aria-live="assertive"></div><div id="ob" role="dialog" aria-modal="true"></div>
<script>
(function(){'use strict';
const K='lrpg_v2',$=s=>document.querySelector(s);
const JOBS={STR:['剣士','⚔️'],AGI:['弓使い','🏹'],INT:['魔法使い','🪄'],VIT:['僧侶','✨']};
const SN={STR:'筋力',AGI:'俊敏',INT:'知恵',VIT:'活力'};
const BOSSES=[['暴食の魔王ダルマドン','👹',1800],['糖質竜シュガーワイバーン','🐉',2400],['夜食の魔女','🧙',3000]];
const TITLES=[['名もなき転生者','N'],['早起きの旅人','N'],['水の守り手','N'],['歩く者','R'],['節制の賢者','R'],['朝焼けの剣士','R'],['継続の魔導士','SR'],['百歩の勇者','SR'],['不屈の探求者','SR'],['世界を歩き切った者','UR']];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const wk=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const need=l=>Math.round(100*Math.pow(l,1.2));
const RK=[[1,'E'],[5,'D'],[9,'C'],[14,'B'],[21,'A'],[30,'S']];
const rk=(l=S.lv)=>RK.filter(x=>l>=x[0]).pop()[1];
const nr=()=>{const n=RK.find(x=>x[0]>S.lv);return n?' ／ RANK '+n[1]+'までLv.'+n[0]:' ／ 最高ランク到達'};
const bm=()=>BOSSES[S.boss.i%BOSSES.length][2];
function def(){return{name:'冒険者',lv:1,exp:0,pts:50,stats:{STR:1,AGI:1,INT:1,VIT:1},job:null,streak:0,potions:0,titles:[0],title:0,start:null,target:null,weights:[],
quests:[{id:'q1',t:'体幹トレーニング15分',stat:'STR',exp:50},{id:'q2',t:'ウォーキング20分',stat:'AGI',exp:50},{id:'q3',t:'間食をひとつ見直す',stat:'INT',exp:40},{id:'q4',t:'水2Lと睡眠6時間以上',stat:'VIT',exp:40}],
meals:{b:null,l:null,d:null},steps:0,stepExp:0,wGot:null,active:false,day:ymd(),
rewards:[{id:'r1',t:'お気に入りのスイーツ',c:250}],boss:{i:0,hp:1800,wk:wk(),claimed:false},log:['冒険が始まった。まずは今日の体重を記録しよう']}}
let S=def();
try{const r=localStorage.getItem(K);if(r)S=Object.assign(def(),JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const log=t=>{S.log.unshift(t);S.log.length=Math.min(S.log.length,20)};
let tab='today',armK=null,tt;
function say(t){const e=$('#ts');e.textContent='【通知】'+t;e.classList.add('s');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('s'),2400)}
function fx(el,t){snd('ok');if(!el)return;const r=el.getBoundingClientRect(),x=r.left+r.width/2+'px',d=document.createElement('div'),g=document.createElement('div');d.className='fx';d.textContent=t;d.style.left=x;d.style.top=r.top+'px';g.className='rg';g.style.left=x;g.style.top=r.top+r.height/2+'px';document.body.append(d,g);setTimeout(()=>{d.remove();g.remove()},1100)}
let ovq=[];
function pop(k,t,m,s){snd('lv');ovq.push([k,t,m,s||'']);if(!$('#ov').classList.contains('s'))ovn()}
function ovn(){const e=$('#ov'),x=ovq.shift();if(!x){e.classList.remove('s');return}e.innerHTML='<div class="ovb"><div class="ovk">'+esc(x[0])+'</div><div class="ovt">'+esc(x[1])+'</div><div class="ovm">'+esc(x[2])+'</div><div>'+esc(x[3])+'</div><small style="display:block;margin-top:16px">タップして閉じる</small></div>';e.classList.add('s')}
let DB=null,UID=null,pm=[],pun=[],lastSync='';
