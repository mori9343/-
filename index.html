<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ライフハント</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Cinzel:wght@600;800&family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--rgb:63,169,255;--ac:#4cc9ff;--lt:#7fd8ff;--p1:#38a0ff;--p2:#1a5fd0;--ink:#e8f3ff;--mu:#8fb0d6;--bg:#030813;--or:#ff4d6d;--rd:#ff6b81;--gl:.3;--ln:rgba(var(--rgb),.3);--a2:rgba(var(--rgb),.16);--sky:radial-gradient(ellipse at 50% 0%,rgba(var(--rgb),.32),transparent 60%),radial-gradient(circle at 88% 92%,rgba(120,60,255,.14),transparent 50%),radial-gradient(circle at 6% 66%,rgba(var(--rgb),.1),transparent 45%);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* rank palettes: system theme */
:root[data-th="sys"][data-rk="E"]{--rgb:110,150,205;--ac:#8fb6e6;--lt:#cfe1f7;--p1:#6f98d0;--p2:#3d5f96;--gl:.12}
:root[data-th="sys"][data-rk="D"]{--rgb:60,200,130;--ac:#5fe3a0;--lt:#a9f5cf;--p1:#3fcf8c;--p2:#1c8a5a;--gl:.2}
:root[data-th="sys"][data-rk="B"]{--rgb:150,110,255;--ac:#b48cff;--lt:#d9c6ff;--p1:#9a6cff;--p2:#5d35c8;--gl:.4}
:root[data-th="sys"][data-rk="A"]{--rgb:255,160,60;--ac:#ffb454;--lt:#ffd9a3;--p1:#ff9f3a;--p2:#c9680f;--gl:.5}
:root[data-th="sys"][data-rk="S"]{--rgb:255,84,112;--ac:#ff5470;--lt:#ffb3c0;--p1:#ff4a6a;--p2:#b8173a;--gl:.7}
/* hunter theme palette */
:root[data-th="hunt"]{--rgb:205,150,70;--ac:#e0b050;--lt:#f3dc9a;--p1:#e6b650;--p2:#a8742a;--ink:#f1e3c4;--mu:#c2ab82;--bg:#140d07;--or:#d9482e;--rd:#e5604a;--sky:radial-gradient(ellipse at 50% 0%,rgba(214,150,70,.3),transparent 60%),radial-gradient(circle at 92% 88%,rgba(150,40,30,.22),transparent 50%),radial-gradient(circle at 6% 70%,rgba(80,120,50,.12),transparent 45%)}
:root[data-th="hunt"][data-rk="E"]{--ac:#b59a6a;--lt:#dcc9a0;--p1:#b8955a;--p2:#7a5a2c;--gl:.1}
:root[data-th="hunt"][data-rk="D"]{--ac:#c8a45a;--lt:#ead3a0;--p1:#c9a24e;--p2:#8c6528;--gl:.2}
:root[data-th="hunt"][data-rk="B"]{--ac:#ecbc54;--lt:#f8e2a8;--p1:#f0c256;--p2:#b27d28;--gl:.4}
:root[data-th="hunt"][data-rk="A"]{--ac:#f6c95e;--lt:#fff0c0;--p1:#f8d064;--p2:#c28a2a;--gl:.5}
:root[data-th="hunt"][data-rk="S"]{--ac:#ffd86e;--lt:#fff6d0;--p1:#ffe07a;--p2:#d49a30;--gl:.7}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#2a5aa0 transparent}
html,body{touch-action:pan-x pan-y}
body{margin:0;background-color:var(--bg);background-image:var(--sky);background-attachment:fixed;color:var(--ink);font:500 15px/1.6 'Noto Sans JP','Hiragino Sans',system-ui,sans-serif;letter-spacing:.02em;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;left:50%;top:32%;width:560px;height:560px;transform:translate(-50%,-50%);border-radius:50%;border:2px dashed var(--ac);outline:1px solid var(--ac);outline-offset:-36px;opacity:.12;pointer-events:none;animation:sp 120s linear infinite}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(0deg,rgba(120,180,255,.035) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.55),transparent 60%)}
::selection{background:rgba(var(--rgb),.35)}
#app{max-width:480px;margin:0 auto;padding:12px 14px 92px;position:relative;z-index:1}
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;padding:14px;margin-bottom:12px;color:var(--ink);background:linear-gradient(180deg,rgba(var(--rgb),.22),rgba(3,8,20,.95));border:1px solid var(--ac);border-radius:3px;box-shadow:0 0 0 1px rgba(var(--rgb),.2),0 0 32px rgba(var(--rgb),var(--gl)),inset 0 1px 0 rgba(255,255,255,.25),inset 0 0 28px rgba(var(--rgb),.14)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(160,220,255,.12) 50%,transparent 60%);transform:translateX(-100%);animation:sw 7s ease-in-out infinite;pointer-events:none}
.lv{font:900 46px/1 'Rajdhani','Noto Sans JP',sans-serif;letter-spacing:-.04em;color:#fff;text-shadow:0 0 6px var(--ac),0 0 22px rgba(var(--rgb),.7);animation:gl2 3.2s ease-in-out infinite}
.lv small{font-size:13px;font-weight:700;letter-spacing:0;margin-right:2px;opacity:.7}
.hn{font-weight:700}
.ht{font-size:12px;opacity:.7}
.hero small{color:inherit}
.hero .bar{grid-column:1/-1;margin-top:2px}
.hero .bar i{background:linear-gradient(90deg,var(--p2),var(--lt));box-shadow:0 0 10px var(--ac)}
.chips{display:flex;gap:8px;margin:0;font:700 14px 'Rajdhani','Noto Sans JP',sans-serif}
.chips span{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;background:rgba(var(--rgb),.12);border:1px solid rgba(var(--rgb),.45);border-radius:2px}
.chips span:nth-child(1){color:#ffd76a}
.chips span:nth-child(2){color:#ff9b54}
.chips span:nth-child(3){color:#9be7ff}
.cd{position:relative;margin-bottom:14px;padding:17px;background:linear-gradient(180deg,rgba(var(--rgb),.14),rgba(4,10,24,.88));border:1px solid rgba(var(--rgb),.45);border-radius:3px;box-shadow:0 10px 26px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 22px rgba(var(--rgb),.07)}
.cd::before,.cd::after{content:"";position:absolute;width:12px;height:12px;pointer-events:none;border:2px solid var(--lt)}
.cd::before{left:-2px;top:-2px;border-right:0;border-bottom:0}
.cd::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
h3{margin:-17px -17px 12px;padding:8px 17px;font:700 14px 'Rajdhani','Noto Sans JP',sans-serif;letter-spacing:.14em;color:var(--lt);background:linear-gradient(90deg,rgba(var(--rgb),.3),transparent);border-bottom:1px solid rgba(var(--rgb),.45);text-shadow:0 0 6px rgba(var(--rgb),.5)}
h3::before{content:"[ "}
h3::after{content:" ]"}
h3.cs{cursor:pointer;-webkit-user-select:none;user-select:none}
h3.cs::before{content:"▾ "}
.cd.col h3.cs::before{content:"▸ "}
h3.cs::after{content:""}
.cd.col h3.cs::after{content:attr(data-s);float:right;font-size:12px;letter-spacing:0;opacity:.85;text-shadow:none}
.cd.col>:not(:first-child){display:none}
.cd.col h3.cs{margin-bottom:-6px;border-bottom:0}
small,.mu{color:var(--mu);font-size:12px}
.warn{color:var(--or);font-weight:700}
.btn{font:inherit;font-weight:700;min-height:40px;padding:8px 12px;cursor:pointer;color:var(--ink);background:rgba(var(--rgb),.16);border:1px solid rgba(var(--rgb),.6);border-radius:2px;-webkit-user-select:none;user-select:none}
.btn:hover,.btn:active{background:rgba(var(--rgb),.35)}
.btn.sm{padding:4px 9px;min-width:40px}
.pri{background:linear-gradient(180deg,var(--p1),var(--p2));border-color:var(--lt);color:#fff;box-shadow:0 0 14px rgba(var(--rgb),.45)}
.pri:hover,.pri:active{background:linear-gradient(180deg,var(--lt),var(--p1))}
.on{background:var(--a2);border-color:var(--ac);color:var(--ac)}
.dg{background:rgba(255,77,109,.16);border-color:var(--rd);color:var(--rd)}
.btn:focus-visible,.in:focus-visible,.nv button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.bar{position:relative;height:10px;overflow:hidden;background:rgba(var(--rgb),.15);border:1px solid rgba(var(--rgb),.35);border-radius:1px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p2),var(--ac));box-shadow:0 0 8px var(--ac);transition:width .35s}
.bar::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 11px,rgba(3,8,19,.65) 11px 12px)}
.or i{background:linear-gradient(90deg,#b3123a,#ff4d6d);box-shadow:0 0 8px #ff4d6d}
.in{font:inherit;font-size:16px;width:100%;min-height:40px;padding:9px 10px;color:var(--ink);background:rgba(2,10,26,.75);border:1px solid rgba(var(--rgb),.5);border-radius:2px}
.in:focus{border-color:var(--ac);box-shadow:0 0 0 2px rgba(var(--rgb),.25)}
.in[type=date]{display:block}
textarea.in{min-height:70px}
label{display:block}
.rw{display:flex;align-items:center;gap:10px}
.g1{flex:1;min-width:0}
.sp{justify-content:space-between}
.gr{display:grid;gap:8px}
.g2{grid-template-columns:1fr auto}
.g3{grid-template-columns:repeat(3,1fr)}
.fw{display:flex;flex-wrap:wrap;gap:6px}
.tc{text-align:center}
.q{padding:9px 0;border-top:1px solid var(--ln)}
.q:first-of-type{border-top:0}
.q.dn{opacity:.72}
.q.dn .t{text-decoration:line-through;color:var(--mu)}
.ck{width:40px;height:40px;flex:none;border-radius:2px;border:2px solid var(--ac);background:none;color:#fff;font-weight:900;cursor:pointer;box-shadow:0 0 8px rgba(var(--rgb),.5)}
.dn .ck{background:#2fd49a;border-color:#2fd49a;box-shadow:0 0 10px rgba(47,212,154,.6)}
.big{font:700 30px/1.1 'Rajdhani','Noto Sans JP',sans-serif;letter-spacing:-.02em}
.bx{text-align:center;padding:8px 4px;border-radius:2px;background:var(--a2);border:1px solid rgba(var(--rgb),.3)}
.lg{font-size:12px;color:var(--mu);padding:3px 0;border-top:1px solid var(--ln)}
.rk{display:inline-block;margin-left:8px;padding:0 8px;border:1px solid currentColor;border-radius:2px;font:700 12px 'Rajdhani',sans-serif;letter-spacing:.1em;vertical-align:1px}
.rE{color:#9db0c8}.rD{color:#6fe39a}.rC{color:#4cc9ff}.rB{color:#b48cff}.rA{color:#ffb454}.rS{color:#ff5470;text-shadow:0 0 8px #ff5470}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-bottom:8px}
.cg small{font-size:11px}
.cg i{display:block}
.cl{display:block;padding:6px 0;border:1px solid var(--ln);border-radius:2px;font:700 13px 'Rajdhani','Noto Sans JP',sans-serif}
.cl.td{border-color:var(--ac);box-shadow:0 0 8px var(--ac)}
.seg{display:flex;margin-bottom:12px;border:1px solid rgba(var(--rgb),.5);border-radius:2px;overflow:hidden}
.seg button{flex:1;min-height:44px;padding:11px 0;font:700 13px 'Noto Sans JP',sans-serif;color:var(--mu);background:rgba(var(--rgb),.08);border:0;cursor:pointer}
.seg button+button{border-left:1px solid rgba(var(--rgb),.35)}
.seg button.on{color:var(--lt);background:rgba(var(--rgb),.28);box-shadow:inset 0 -2px 0 var(--ac)}
.nv{position:fixed;z-index:10;left:0;right:0;bottom:0;display:flex;background:rgba(3,10,26,.88);backdrop-filter:blur(10px);border-top:1px solid var(--ac);box-shadow:0 -6px 20px rgba(var(--rgb),.25);padding-bottom:env(safe-area-inset-bottom,0px)}
.nv button{flex:1;padding:9px 0 8px;font:700 11px 'Noto Sans JP',sans-serif;color:var(--mu);background:none;border:0;cursor:pointer}
.nv button b{display:block;font-size:19px;line-height:1.2}
.nv .cur{position:relative;color:var(--ac);text-shadow:0 0 10px var(--ac)}
.nv .cur::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--ac);box-shadow:0 0 10px var(--ac)}
#ts{position:fixed;z-index:30;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);max-width:92vw;padding:9px 16px;text-align:center;font-size:13px;font-weight:700;color:var(--lt);background:rgba(6,18,42,.96);border:1px solid var(--ac);border-radius:2px;box-shadow:0 0 18px rgba(var(--rgb),.5);opacity:0;pointer-events:none;transition:opacity .2s}
#ts.s{opacity:1}
#ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(2,6,18,.84);cursor:pointer}
#ov.s{display:flex}
#ob{position:fixed;inset:0;z-index:25;display:none;padding:12px;overflow:auto;background:rgba(2,6,18,.96)}
#ob.s{display:flex}
.ovb{width:100%;max-width:320px;padding:20px 16px;text-align:center;background:linear-gradient(180deg,rgba(10,30,66,.96),rgba(4,12,30,.98));border:1px solid var(--ac);box-shadow:0 0 44px rgba(var(--rgb),.55),inset 0 0 30px rgba(var(--rgb),.2);animation:pp .4s ease-out}
.ovk{color:var(--lt);letter-spacing:.2em;font-size:13px}
.ovt{margin:6px 0;font:700 26px 'Rajdhani','Noto Sans JP',sans-serif;letter-spacing:.16em;color:#fff;text-shadow:0 0 8px var(--ac),0 0 26px var(--ac)}
.ovm{margin-bottom:6px;font:700 34px/1.15 'Rajdhani','Noto Sans JP',sans-serif;color:var(--lt)}
#ob .ovb{max-width:360px;padding:16px 14px}
#ob .ovt{font-size:22px!important;margin:2px 0}
#ob p.mu{font-size:12px;margin:6px 0}
#ob .gr{grid-template-columns:1fr 1fr;gap:8px}
#ob .gr>label:first-child,#ob .gr>button{grid-column:1/-1}
#ob label small{display:block;margin-bottom:2px}
#ob .in{min-height:38px;padding:6px 10px}
.fx{position:fixed;z-index:15;transform:translate(-50%,0);font:700 20px 'Rajdhani',sans-serif;color:#fff;text-shadow:0 0 8px var(--ac),0 0 18px var(--ac);pointer-events:none;animation:fl 1s ease-out forwards}
.rg{position:fixed;z-index:15;width:30px;height:30px;margin:-15px 0 0 -15px;border:2px solid var(--lt);pointer-events:none;animation:rg .7s ease-out forwards}
.bart{display:flex;justify-content:center;padding:6px 0;background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--bc) 22%,transparent),transparent 62%)}
.bs{width:112px;height:112px;overflow:visible;filter:drop-shadow(0 0 7px var(--bc));animation:bp 3.4s ease-in-out infinite}
.bs path{fill:rgba(8,3,14,.88);stroke:var(--bc);stroke-width:1.6;stroke-linejoin:round}
.bs .e{fill:#ffe45e;stroke:none;animation:ey 4s steps(1) infinite}
.bs .t{fill:none}
.bs .v{fill:#000;stroke-width:1}
.bart.dead .bs{filter:grayscale(1) opacity(.45);animation:none}
.fl{display:inline-block;vertical-align:-3px;transform-origin:50% 90%;animation:fk 1.2s ease-in-out infinite;filter:drop-shadow(0 0 4px #ff8a2a)}
.fl.hot{filter:drop-shadow(0 0 6px #ffb040)}
.fl.blue{filter:hue-rotate(195deg) saturate(1.3) drop-shadow(0 0 6px #6ad0ff)}
#mn.ani .cd{animation:up .35s ease-out both}
@keyframes sp{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes sw{55%,100%{transform:translateX(100%)}}
@keyframes gl2{50%{text-shadow:0 0 10px var(--ac),0 0 34px rgba(var(--rgb),.95)}}
@keyframes pp{from{transform:scale(.88);opacity:0}}
@keyframes fl{to{transform:translate(-50%,-60px);opacity:0}}
@keyframes rg{to{transform:scale(3.2);opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes bp{50%{transform:translateY(-3px);filter:drop-shadow(0 0 12px var(--bc))}}
@keyframes ey{0%,92%,100%{opacity:1}95%{opacity:.2}}
@keyframes fk{50%{transform:scale(1.07,1.15) rotate(-3deg)}}
/* hunter theme */
[data-th=hunt] body{font-family:'Noto Sans JP','Hiragino Sans',sans-serif}
[data-th=hunt] body::after{background:radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.6),transparent 60%),repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 7px)}
[data-th=hunt] h3,[data-th=hunt] .hn{font-family:'Cinzel','Shippori Mincho','Hiragino Mincho ProN',serif}
[data-th=hunt] .lv,[data-th=hunt] .big,[data-th=hunt] .ovt,[data-th=hunt] .ovm{font-family:'Cinzel','Shippori Mincho',serif}
[data-th=hunt] .hero{background:linear-gradient(165deg,#34241a,#181009);border:2px solid #b88a3c;border-radius:4px;box-shadow:inset 0 0 0 2px #181009,inset 0 0 0 3px rgba(214,170,90,.4),0 10px 22px rgba(0,0,0,.6),0 0 26px rgba(var(--rgb),var(--gl))}
[data-th=hunt] .hero::after{display:none}
[data-th=hunt] .lv{color:var(--lt);text-shadow:0 2px 0 #4a2f0e,0 0 14px rgba(var(--rgb),.5);animation:none}
[data-th=hunt] .hero .bar{background:#0c0805;border-color:#b88a3c;height:12px}
[data-th=hunt] .hero .bar i{background:linear-gradient(180deg,#9fe05a,#4a9a2e);box-shadow:0 0 8px rgba(130,220,70,.55)}
[data-th=hunt] .chips span{background:rgba(0,0,0,.35);border-color:#8a6a3a;border-radius:3px}
[data-th=hunt] .chips span:nth-child(3){color:#d6f0b8}
[data-th=hunt] .cd{background:linear-gradient(180deg,#2e2016,#1a110a);border:2px solid #9a7234;border-radius:4px;box-shadow:inset 0 0 0 2px #1a110a,inset 0 0 0 3px rgba(214,170,90,.35),0 8px 18px rgba(0,0,0,.5)}
[data-th=hunt] .cd::before,[data-th=hunt] .cd::after{width:8px;height:8px;border:0;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--lt),#8a6420);top:6px;bottom:auto}
[data-th=hunt] .cd::before{left:6px}
[data-th=hunt] .cd::after{right:6px}
[data-th=hunt] h3{background:linear-gradient(90deg,#6b4a1e,#3a2813 70%,transparent);border-bottom:1px solid #b88a3c;color:#f6e2b0;text-shadow:0 1px 0 #000;letter-spacing:.1em;padding-left:22px}
[data-th=hunt] h3::before{content:"◆ ";color:var(--ac)}
[data-th=hunt] h3::after{content:""}
[data-th=hunt] h3.cs::before{content:"▾ "}
[data-th=hunt] .cd.col h3.cs::before{content:"▸ "}
[data-th=hunt] .q{background:linear-gradient(180deg,#eadbb4,#dcc895);color:#2b1d10;border:1px solid #8a6a3a;border-radius:2px;padding:8px 10px;margin-bottom:6px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
[data-th=hunt] .q:first-of-type{border-top:1px solid #8a6a3a}
[data-th=hunt] .q small{color:#6b5233}
[data-th=hunt] .q .warn{color:#a8431f}
[data-th=hunt] .q .btn{background:linear-gradient(180deg,#4a3420,#2a1c10);color:#f1e3c4;border-color:#8a6a3a;box-shadow:none}
[data-th=hunt] .q .btn.pri{background:linear-gradient(180deg,#eec35c,#a8742a);color:#2a1a08;border-color:#f3dc9a}
[data-th=hunt] .q .btn.dg{background:#7a2a1c;color:#fff}
[data-th=hunt] .q .ck{border-color:#7a5a24;box-shadow:none;background:rgba(255,255,255,.4)}
[data-th=hunt] .q.dn{opacity:.82}
[data-th=hunt] .q.dn .t{color:#7a6444}
[data-th=hunt] .q.dn .ck{background:#3f8f34;border-color:#2a6a22;color:#fff}
[data-th=hunt] .q .rk{filter:brightness(.55)}
[data-th=hunt] .btn{background:linear-gradient(180deg,#4a3420,#2a1c10);border-color:#a38638;border-radius:3px;box-shadow:inset 0 1px 0 rgba(255,236,179,.18),0 2px 0 #0a0603}
[data-th=hunt] .btn:hover,[data-th=hunt] .btn:active{background:linear-gradient(180deg,#5c4128,#33220f)}
[data-th=hunt] .btn:active{transform:translateY(1px)}
[data-th=hunt] .pri{background:linear-gradient(180deg,var(--p1),var(--p2));border-color:var(--lt);color:#2a1a08;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 0 #0a0603}
[data-th=hunt] .on{background:rgba(224,176,80,.2);border-color:var(--ac);color:var(--lt)}
[data-th=hunt] .dg{background:rgba(217,72,46,.25);border-color:#e5604a;color:#ffb3a3}
[data-th=hunt] .in{background:#140d07;border-color:#8a6a3a;border-radius:3px}
[data-th=hunt] .in:focus{border-color:var(--ac);box-shadow:0 0 0 2px rgba(224,176,80,.3)}
[data-th=hunt] .seg{border-color:#8a6a3a;border-radius:3px}
[data-th=hunt] .seg button{background:#241810;color:#bfa57a}

function award(o){let e=Math.round((o.exp||0)*DF().x*(o.stat&&o.stat!=='STR'?1+sb(o.stat):1)*(1+Math.min(.5,(S.rb||0)*.05)));if(o.stat&&S.job===o.stat)e=Math.round(e*1.3);const pp=Math.round((o.pts||0)*DF().p);
